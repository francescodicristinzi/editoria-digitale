id: safety-component
status: approved
perspective:
- legal
- technical
prefLabel:
  en: Safety component
  it: Componente di sicurezza
altLabel:
  en:
  - Safety component of a product or system
  - Safety part
definition:
  en: >-
    A component of a product or of an AI system which fulfils a safety function for that product or AI
    system, or the failure or malfunctioning of which endangers the health and safety of persons or property.
  it: >-
    Componente di un prodotto o di un sistema di IA che svolge una funzione di sicurezza per tale prodotto
    o sistema di IA, oppure il cui guasto o malfunzionamento mette in pericolo la salute e la sicurezza
    di persone o beni.
related:
- high-risk-ai-system
sources:
- ref: ai-act
  locator: Art. 3(14)
