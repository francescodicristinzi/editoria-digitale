definition:
  en: >-
    An AI system which is based on a general-purpose AI model and which has the capability to serve a
    variety of purposes, both for direct use as well as for integration in other AI systems.
  it: >-
    Sistema di IA basato su un modello di IA per finalità generali e che ha la capacità di perseguire
    varie finalità, sia per uso diretto sia per integrazione in altri sistemi di IA.
