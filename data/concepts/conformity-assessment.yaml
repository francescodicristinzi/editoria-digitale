id: conformity-assessment
status: approved
perspective:
- legal
- technical
prefLabel:
  en: Conformity assessment
  it: Valutazione della conformità
definition:
  en: >-
    The process of demonstrating whether the requirements set out in Chapter III, Section 2 relating to
    a high-risk AI system have been fulfilled.
  it: >-
    Processo volto a dimostrare se i requisiti di cui al capo III, sezione 2, relativi a un sistema di
    IA ad alto rischio sono stati soddisfatti.
related:
- ce-marking
- notified-body
sources:
- ref: ai-act
  locator: Art. 3(20); Art. 43
