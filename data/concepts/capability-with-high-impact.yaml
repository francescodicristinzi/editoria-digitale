id: capability-with-high-impact
status: approved
perspective:
- legal
- technical
prefLabel:
  en: Capability with high impact
  it: Capacità ad alto impatto
definition:
  en: >-
    A capability that equals or surpasses the capabilities recorded in the most advanced GPAI models,
    and which may pose systemic risks.
  it: >-
    Capacità che eguaglia o supera quelle registrate nei modelli di IA per finalità generali più avanzati
    e che può comportare rischi sistemici.
related:
- systemic-risk
sources:
- ref: ai-act
  locator: Art. 3(64)
